name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      AUTH0_DOMAIN: weather-auth-tests.example
      AUTH0_AUDIENCE: https://fidenz-weather-api
      OPENWEATHER_API_KEY: ci-placeholder-not-a-real-key
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    env:
      VITE_API_BASE_URL: http://localhost:5000
      VITE_AUTH0_DOMAIN: weather-auth-tests.example
      VITE_AUTH0_CLIENT_ID: ci-placeholder-client-id
      VITE_AUTH0_AUDIENCE: https://fidenz-weather-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build